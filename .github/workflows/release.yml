name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest and script
        run: |
          python3 -c "import json; m=json.load(open('manifest.json')); assert m['manifest_version']==3; print(m['name'], m['version'])"
          node --check content.js
      - name: Version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")" = "${GITHUB_REF_NAME}"
      - name: Package
        run: zip -r resume-podcast-jn.zip manifest.json content.js icons
      - uses: actions/upload-artifact@v4
        with:
          name: resume-podcast-jn
          path: resume-podcast-jn.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" resume-podcast-jn.zip --title "$GITHUB_REF_NAME" --generate-notes
